services:
  db:
    image: mysql:8.4
    container_name: smp-mysql
    restart: unless-stopped
    environment:
     MYSQL_ROOT_PASSWORD: exemplo_root_local
    MYSQL_DATABASE: smp_servicos
    MYSQL_USER: smp_user
    MYSQL_PASSWORD: exemplo_usuario_local
    ports:
      - "3306:3306"
    volumes:
      - smp_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
  test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
  interval: 5s
  timeout: 5s
  retries: 20
volumes:
  smp_mysql_data:
