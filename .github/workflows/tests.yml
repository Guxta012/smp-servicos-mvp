name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: smp_root_dev_password
          MYSQL_DATABASE: smp_servicos
          MYSQL_USER: smp_user
          MYSQL_PASSWORD: smp_dev_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psmp_root_dev_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar banco de dados
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql -h 127.0.0.1 -P 3307 -u smp_user -psmp_dev_password smp_servicos < schema.sql

      - name: Executar testes
        run: python -m pytest -v